{% extends "base.html" %}
{% block titel %}Neue Anzeige erstellen{% endblock %}

{% block inhalt %}
    <h1>Neue Anzeige erstellen</h1>

    <form method="post" enctype="multipart/form-data" class="formular">
        <label for="titel">Titel</label>
        <input type="text" id="titel" name="titel" placeholder="z. B. Blaue Jeansjacke" required>

        <label for="kategorie">Kategorie</label>
        <select id="kategorie" name="kategorie" required>
            <option value="" disabled selected>Bitte wählen</option>
            {% for k in kategorien %}
                <option value="{{ k }}">{{ k }}</option>
            {% endfor %}
        </select>

        <label for="preis">Preis (€)</label>
        <input type="number" id="preis" name="preis" step="0.5" min="0" placeholder="z. B. 12.50" required>

        <label for="bild">Bild</label>
        <input type="file" id="bild" name="bild" accept="image/png, image/jpeg, image/webp" required>

        <button type="submit" class="button-primary">Anzeige veröffentlichen</button>
    </form>
{% endblock %}
